name: 'AI Contribution Quality Filter'
description: 'Detects AI-generated code in PRs and scores quality (0-100) to help maintainers filter bad contributions.
author: 'Noorislam-XD'

branding:
  icon: 'shield'
  color: 'purple'

inputs:
  github-token:
    description: 'GitHub token for API access (use ${{ secrets.GITHUB_TOKEN }})'
    required: true

  # ── LLM integration (optional) ─────────────────────────────────────────────
  openai-api-key:
    description: |
      OpenAI API key for LLM-enhanced AI detection and quality analysis.
      When provided, the action uses GPT to semantically review the diff and blends
      those results (65% weight) with heuristic analysis (35% weight) for higher accuracy.
      Store as a repository secret: ${{ secrets.OPENAI_API_KEY }}
    required: false
    default: ''
  anthropic-api-key:
    description: |
      Anthropic API key for LLM-enhanced analysis using Claude.
      Used only if openai-api-key is not provided.
      Store as a repository secret: ${{ secrets.ANTHROPIC_API_KEY }}
    required: false
    default: ''
  llm-model:
    description: |
      LLM model to use for analysis.
      OpenAI default: gpt-4o-mini (fast, cheap, accurate).
      Anthropic default: claude-3-haiku-20240307.
      You can override with gpt-4o, claude-3-5-sonnet-20241022, etc.
    required: false
    default: ''

  # ── Scoring thresholds ──────────────────────────────────────────────────────
  min-quality-score:
    description: 'Minimum quality score (0-100) required to pass. PRs below this score are flagged.'
    required: false
    default: '50'
  ai-detection-threshold:
    description: 'Confidence threshold (0-1) for classifying code as AI-generated.'
    required: false
    default: '0.65'

  # ── Automated actions ───────────────────────────────────────────────────────
  fail-on-low-quality:
    description: 'Fail the workflow check if quality score is below min-quality-score.'
    required: false
    default: 'false'
  comment-on-pr:
    description: 'Post a detailed quality report comment on the pull request.'
    required: false
    default: 'true'
  label-pr:
    description: 'Add labels to the pull request based on analysis results.'
    required: false
    default: 'true'
  ai-generated-label:
    description: 'Label to apply when AI-generated code is detected.'
    required: false
    default: 'ai-generated'
  low-quality-label:
    description: 'Label to apply when quality score is below threshold.'
    required: false
    default: 'needs-improvement'
  high-quality-label:
    description: 'Label to apply when quality score passes threshold.'
    required: false
    default: 'quality-verified'

  # ── Contributor allowlist / blocklist ────────────────────────────────────────
  trusted-contributors:
    description: |
      Comma-separated GitHub usernames (or wildcard patterns) that always pass
      without scoring. Example: "alice,bob,myorg-bot*"
      Wildcards match the end of the username (e.g. "myorg-*" matches "myorg-ci", "myorg-bot").
    required: false
    default: ''
  blocked-contributors:
    description: |
      Comma-separated GitHub usernames that are always auto-failed, regardless
      of their actual code quality score. Takes priority over trusted-contributors.
      Example: "spammer1,known-bad-actor"
    required: false
    default: ''
  trust-bots:
    description: |
      Automatically trust well-known GitHub automation bots (dependabot, renovate,
      github-actions, snyk-bot, imgbot, etc.) and any user ending in "[bot]".
      Set to "false" to analyze bot PRs like normal contributors.
    required: false
    default: 'true'
  trusted-org:
    description: |
      GitHub organization name whose members are automatically trusted.
      Requires the GITHUB_TOKEN to have "read:org" scope, or use a PAT with
      that scope instead. Leave empty to disable org-based trust.
      Example: "my-company"
    required: false
    default: ''
  blocked-score-cap:
    description: |
      Quality score assigned to PRs from blocked contributors (0-100). Default: 0.
    required: false
    default: '0'
  skip-analysis-for-trusted:
    description: |
      When true (default), trusted contributor PRs are approved immediately
      without running the full analysis. Set to "false" to still run analysis
      but treat the contributor as trusted (useful for metrics).
    required: false
    default: 'true'

  # ── Automated review actions ─────────────────────────────────────────────────
  request-changes-on-low-quality:
    description: |
      Submit a "Request changes" GitHub review when the quality score is below
      request-changes-threshold. The review blocks merge until dismissed or resolved.
      Requires "pull-requests: write" permission.
    required: false
    default: 'false'
  request-changes-threshold:
    description: |
      Quality score threshold for requesting changes (0-100).
      Defaults to the value of min-quality-score if not set.
    required: false
    default: ''
  auto-approve-on-pass:
    description: |
      Submit an "Approve" review when the PR passes the quality threshold AND
      no AI-generated code is detected. Only enable this if you trust the action
      as a sole reviewer for basic quality gating.
      Requires "pull-requests: write" permission.
    required: false
    default: 'false'
  auto-close-on-low-quality:
    description: |
      Automatically close the PR when the quality score drops below
      auto-close-threshold. Use with caution — this is a hard rejection.
      Requires "pull-requests: write" and "contents: write" permissions.
    required: false
    default: 'false'
  auto-close-threshold:
    description: |
      Quality score threshold for auto-closing the PR (0-100).
      Should be lower than min-quality-score. Default: 20.
    required: false
    default: '20'
  auto-close-comment:
    description: |
      Custom comment posted when a PR is auto-closed. Leave empty for the
      default message that explains the score and how to re-open.
    required: false
    default: ''

  # ── Score history & badge ───────────────────────────────────────────────────
  track-history:
    description: |
      Save a score history entry to .github/quality-scores.json and update
      .github/quality-badge.json on every PR analysis.
      Requires "contents: write" permission in your workflow.
      Set to "false" to disable.
    required: false
    default: 'true'
  history-branch:
    description: |
      Branch where .github/quality-scores.json and .github/quality-badge.json
      are written. Defaults to the repository default branch (main/master).
    required: false
    default: ''

  # ── Performance ─────────────────────────────────────────────────────────────
  max-files-analyzed:
    description: 'Maximum number of files to analyze per PR (for performance).'
    required: false
    default: '50'
  exclude-paths:
    description: 'Comma-separated glob patterns to exclude from analysis.'
    required: false
    default: '*.md,*.lock,dist/**,build/**,*.min.js,*.min.css,package-lock.json,pnpm-lock.yaml,yarn.lock'

outputs:
  quality-score:
    description: 'Overall quality score from 0 to 100.'
  ai-detected:
    description: '"true" if AI-generated code was detected above the threshold, "false" otherwise.'
  ai-confidence:
    description: 'AI detection confidence score from 0 to 1.'
  files-analyzed:
    description: 'Number of files analyzed in this PR.'
  passed:
    description: '"true" if the PR passed the quality threshold, "false" otherwise.'

runs:
  using: 'node20'
  main: 'dist/index.js'
