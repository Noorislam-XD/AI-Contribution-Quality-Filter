name: AI Contribution Quality Filter

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write
  contents: write   # required for score history tracking

jobs:
  quality-filter:
    name: Analyze PR Quality
    runs-on: ubuntu-latest
    steps:
      - name: Run AI Contribution Quality Filter
        id: quality
        uses: Noorislam-XD/AI-Contribution-Quality-Filter@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          # ── Optional: LLM-enhanced detection ──────────────────────────────────
          # openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          # anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}

          # ── Scoring ───────────────────────────────────────────────────────────
          min-quality-score: 50
          ai-detection-threshold: 0.65
          fail-on-low-quality: false

          # ── Contributor allowlist / blocklist ─────────────────────────────────
          trust-bots: true                # dependabot, renovate, etc. auto-pass
          # trusted-contributors: alice,bob,myorg-bot*
          # blocked-contributors: spammer1,known-bad-actor
          # trusted-org: my-company       # all org members auto-pass

          # ── PR comments & labels ──────────────────────────────────────────────
          comment-on-pr: true
          label-pr: true

          # ── Automated reviews ─────────────────────────────────────────────────
          request-changes-on-low-quality: false
          auto-approve-on-pass: false
          auto-close-on-low-quality: false

          # ── History & badge ───────────────────────────────────────────────────
          track-history: true

      - name: Print results
        run: |
          echo "Quality Score : ${{ steps.quality.outputs.quality-score }}/100"
          echo "AI Detected   : ${{ steps.quality.outputs.ai-detected }}"
          echo "Files Analyzed: ${{ steps.quality.outputs.files-analyzed }}"
          echo "Passed        : ${{ steps.quality.outputs.passed }}"
