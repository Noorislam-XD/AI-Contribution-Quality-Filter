name: AI Contribution Quality Filter

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write
  contents: write   # required for score history tracking

jobs:
  quality-filter:
    name: Analyze PR Quality
    runs-on: ubuntu-latest
    steps:
      - name: Run AI Contribution Quality Filter
        id: quality
        uses: Noorislam-XD/AI-Contribution-Quality-Filter@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # ── Optional: enable LLM-enhanced detection ──
          # openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          # anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # ── Scoring ──
          min-quality-score: 50
          ai-detection-threshold: 0.65
          fail-on-low-quality: false
          # ── PR actions ──
          comment-on-pr: true
          label-pr: true
          ai-generated-label: ai-generated
          low-quality-label: needs-improvement
          high-quality-label: quality-verified
          # ── History tracking ──
          track-history: true
          # history-branch: main   # defaults to repo default branch
          # ── Performance ──
          max-files-analyzed: 50
          exclude-paths: '*.md,*.lock,dist/**,build/**,*.min.js,*.min.css,package-lock.json,pnpm-lock.yaml,yarn.lock'

      - name: Print results
        run: |
          echo "Quality Score : ${{ steps.quality.outputs.quality-score }}/100"
          echo "AI Detected   : ${{ steps.quality.outputs.ai-detected }}"
          echo "AI Confidence : ${{ steps.quality.outputs.ai-confidence }}"
          echo "Files Analyzed: ${{ steps.quality.outputs.files-analyzed }}"
          echo "Passed        : ${{ steps.quality.outputs.passed }}"
