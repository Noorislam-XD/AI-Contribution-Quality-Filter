name: Strict AI Quality Gate (LLM + Auto-Review)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write
  contents: write

jobs:
  quality-gate:
    name: Quality Gate (Strict)
    runs-on: ubuntu-latest
    steps:
      - name: Run AI Contribution Quality Filter
        id: quality
        uses: Noorislam-XD/AI-Contribution-Quality-Filter@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}

          # Scoring
          min-quality-score: 70
          ai-detection-threshold: 0.55

          # Fail the CI check so the status shows red
          fail-on-low-quality: true

          # Request changes when score < 70 (blocks merge via branch protection)
          request-changes-on-low-quality: true
          request-changes-threshold: 70

          # Auto-approve when score >= 70 and no AI detected
          auto-approve-on-pass: true

          # Hard-reject completely hopeless PRs (score < 20)
          auto-close-on-low-quality: true
          auto-close-threshold: 20

          # History
          track-history: true

      - name: Print results
        run: |
          echo "Score : ${{ steps.quality.outputs.quality-score }}/100"
          echo "Passed: ${{ steps.quality.outputs.passed }}"
          echo "AI    : ${{ steps.quality.outputs.ai-detected }}"
