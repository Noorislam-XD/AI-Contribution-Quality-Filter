name: Strict AI Quality Gate (Full Features)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write
  contents: write

jobs:
  quality-gate:
    name: Quality Gate (Strict)
    runs-on: ubuntu-latest
    steps:
      - name: Run AI Contribution Quality Filter
        id: quality
        uses: Noorislam-XD/AI-Contribution-Quality-Filter@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}

          # Scoring
          min-quality-score: 70
          ai-detection-threshold: 0.55
          fail-on-low-quality: true

          # Allowlist — core team and bots always pass
          trust-bots: true
          trusted-contributors: alice,bob,carol
          # trusted-org: my-company       # all org members auto-pass
          blocked-contributors: ''        # add known bad actors here

          # Automated reviews
          request-changes-on-low-quality: true
          request-changes-threshold: 70
          auto-approve-on-pass: true
          auto-close-on-low-quality: true
          auto-close-threshold: 20

          # History
          track-history: true

      - name: Print results
        run: |
          echo "Score : ${{ steps.quality.outputs.quality-score }}/100"
          echo "Passed: ${{ steps.quality.outputs.passed }}"
          echo "AI    : ${{ steps.quality.outputs.ai-detected }}"
